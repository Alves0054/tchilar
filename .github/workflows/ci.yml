# Verificação automática em cada push e pull request: lint, testes (com PostgreSQL a sério),
# testes do frontend, auditoria de segurança das dependências e build.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: biva
          POSTGRES_PASSWORD: biva-ci-only
          POSTGRES_DB: biva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biva -d biva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://biva:biva-ci-only@localhost:5432/biva_test
      DATABASE_URL: postgresql://biva:biva-ci-only@localhost:5432/biva_test
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migrações numa base de dados vazia
        run: npm run db:migrate
      - name: Lint
        run: npm run lint
      - name: Verificação de tipos (servidor)
        run: npm run typecheck
      - name: Testes do servidor (inclui integração com PostgreSQL)
        run: npm test
      - name: Limites de pedidos partilhados entre cópias (Redis)
        run: node --test server/rate-limit.test.js
        env:
          REDIS_URL: redis://localhost:6379
      - name: Testes do frontend e acessibilidade
        run: npm run test:web
      - name: Dependências sem vulnerabilidades conhecidas
        run: npm audit --audit-level=high
      - name: Build de produção
        run: npm run build
      - name: Imagem Docker compila
        run: docker build -t biva-ci .
      - name: Configuração do nginx válida
        run: docker run --rm -v "$PWD/deploy/nginx-biva.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
