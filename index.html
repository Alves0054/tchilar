<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- preview -->
  <title>Tchilar</title>
  <meta name="description" content="Tchilar — conecta, partilha, vive. A rede social para estares perto de quem importa.">
  <meta property="og:title" content="Tchilar — conecta, partilha, vive">
  <meta property="og:description" content="Partilha momentos, conversa e encontra a tua comunidade no Tchilar.">
  <meta property="og:image" content="/tchilar-logo-full.png">
  <meta property="og:type" content="website">
  <!-- /preview -->
  <!-- O servidor troca o bloco acima pelas etiquetas de cada perfil, publicação ou curso (server/link-preview.js). -->
  <meta name="theme-color" content="#0B0B0C">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="icon" type="image/png" href="/tchilar-logo.png">
  <link rel="apple-touch-icon" href="/tchilar-logo.png">
  <!-- No iPhone, os avisos do site só chegam com o Tchilar no ecrã principal (precisa do manifesto). -->
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    /* Arranque: o logótipo desfoca e foca enquanto o site carrega (o React substitui isto ao abrir). */
    .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #FFFFFF; }
    .boot img { width: min(220px, 56vw); height: auto; animation: boot-focus 1.6s ease-in-out infinite alternate; will-change: filter, transform, opacity; }
    .boot .boot-dark { display: none; }
    html.boot-is-dark .boot { background: #0B0B0C; }
    html.boot-is-dark .boot .boot-light { display: none; }
    html.boot-is-dark .boot .boot-dark { display: block; }
    @keyframes boot-focus {
      from { filter: blur(12px); transform: scale(1.06); opacity: .35; }
      to { filter: blur(0); transform: scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
  </style>
  <script>
    // Mesmo tema que o site vai usar (escolha guardada ou a do sistema), para o ecrã de arranque não piscar.
    try {
      var saved = localStorage.getItem("tchilar-theme") || localStorage.getItem("biva-theme");
      var dark = saved === "dark" || (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.classList.add("boot-is-dark");
    } catch (e) { /* sem armazenamento: tema claro */ }
  </script>
</head>
<body>
  <div id="root"><div class="boot" role="status" aria-label="A carregar o Tchilar">
    <img class="boot-light" src="/tchilar-logo-full.png" alt="Tchilar">
    <img class="boot-dark" src="/tchilar-logo-full-dark.png" alt="Tchilar">
  </div></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
