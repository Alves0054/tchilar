# nginx à frente da Tchilar. Copia para /etc/nginx/sites-available/tchilar, troca tchilar.ao pelo teu domínio,
# ativa com: ln -s /etc/nginx/sites-available/tchilar /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# O HTTPS (Let's Encrypt) é acrescentado automaticamente por: certbot --nginx -d tchilar.ao -d www.tchilar.ao

# Limite extra contra abusos, por IP (o servidor da Tchilar tem os seus próprios limites no login).
limit_req_zone $binary_remote_addr zone=tchilar_api:10m rate=30r/s;

# Cópias da API. Com uma só cópia fica como está; para crescer, arranca mais (portas 4001, 4002...)
# e acrescenta uma linha "server" em CADA um dos dois blocos (ver deploy/README.md, secção 7).
upstream tchilar_app {
    least_conn;
    server 127.0.0.1:4000;
    keepalive 32;
}

# Os diretos vão sempre para a mesma cópia: a contagem de espectadores, o modo lento do chat e as
# reações vivem na memória da cópia que trata o direto. "consistent" mexe no mínimo ao juntar cópias.
upstream tchilar_lives {
    hash $tchilar_live_id consistent;
    server 127.0.0.1:4000;
    keepalive 32;
}

map $uri $tchilar_live_id {
    ~^/api/lives/(?<live>[0-9]+) $live;
    default $uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name tchilar.ao www.tchilar.ao;

    # Vídeos e fotos até 100 MB (o mesmo limite do servidor).
    client_max_body_size 100m;
    server_tokens off;

    # Pedidos de um direto concreto (sinal de vida, chat, reações, moderação): sempre a mesma cópia.
    location ~ ^/api/lives/[0-9]+ {
        limit_req zone=tchilar_api burst=60 nodelay;
        proxy_pass http://tchilar_lives;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        limit_req zone=tchilar_api burst=60 nodelay;
        proxy_pass http://tchilar_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Com TRUST_PROXY=1 no .env, a Tchilar lê o IP real daqui (limites de tentativas por pessoa).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Diretos: servidor de vídeo (MediaMTX). Só é preciso com «docker compose --profile live».
# HTTPS: certbot --nginx -d live.tchilar.ao. A CDN usa este endereço como origem do HLS.
server {
    listen 80;
    listen [::]:80;
    server_name live.tchilar.ao;
    server_tokens off;

    # WHIP: o estúdio do browser e o OBS enviam o vídeo (WebRTC) para aqui.
    location ~ ^/live/u[0-9]+/whip {
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HLS: listas mudam a cada segundo; os segmentos nunca mudam e podem ficar na CDN.
    location ~ ^/live/u[0-9]+/.*\.m3u8$ {
        proxy_pass http://127.0.0.1:8888;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=1" always;
    }
    location ~ ^/live/u[0-9]+/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=60, immutable" always;
    }

    location / {
        return 404;
    }
}
