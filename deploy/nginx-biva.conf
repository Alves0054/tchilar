# nginx à frente da Biva. Copia para /etc/nginx/sites-available/biva, troca biva.ao pelo teu domínio,
# ativa com: ln -s /etc/nginx/sites-available/biva /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# O HTTPS (Let's Encrypt) é acrescentado automaticamente por: certbot --nginx -d biva.ao -d www.biva.ao

# Limite extra contra abusos, por IP (o servidor da Biva tem os seus próprios limites no login).
limit_req_zone $binary_remote_addr zone=biva_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name biva.ao www.biva.ao;

    # Vídeos e fotos até 100 MB (o mesmo limite do servidor).
    client_max_body_size 100m;
    server_tokens off;

    location / {
        limit_req zone=biva_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Com TRUST_PROXY=1 no .env, a Biva lê o IP real daqui (limites de tentativas por pessoa).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
