# nginx à frente da Biva. Copia para /etc/nginx/sites-available/biva, troca biva.ao pelo teu domínio,
# ativa com: ln -s /etc/nginx/sites-available/biva /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# O HTTPS (Let's Encrypt) é acrescentado automaticamente por: certbot --nginx -d biva.ao -d www.biva.ao

# Limite extra contra abusos, por IP (o servidor da Biva tem os seus próprios limites no login).
limit_req_zone $binary_remote_addr zone=biva_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name biva.ao www.biva.ao;

    # Vídeos e fotos até 100 MB (o mesmo limite do servidor).
    client_max_body_size 100m;
    server_tokens off;

    location / {
        limit_req zone=biva_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Com TRUST_PROXY=1 no .env, a Biva lê o IP real daqui (limites de tentativas por pessoa).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Diretos: servidor de vídeo (MediaMTX). Só é preciso com «docker compose --profile live».
# HTTPS: certbot --nginx -d live.biva.ao. A CDN usa este endereço como origem do HLS.
server {
    listen 80;
    listen [::]:80;
    server_name live.biva.ao;
    server_tokens off;

    # WHIP: o estúdio do browser e o OBS enviam o vídeo (WebRTC) para aqui.
    location ~ ^/live/u[0-9]+/whip {
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HLS: listas mudam a cada segundo; os segmentos nunca mudam e podem ficar na CDN.
    location ~ ^/live/u[0-9]+/.*\.m3u8$ {
        proxy_pass http://127.0.0.1:8888;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=1" always;
    }
    location ~ ^/live/u[0-9]+/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=60, immutable" always;
    }

    location / {
        return 404;
    }
}
