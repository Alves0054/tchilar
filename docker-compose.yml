services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: biva
      POSTGRES_USER: biva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - biva-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biva -d biva"]
      interval: 5s
      timeout: 5s
      retries: 10

  app: &app
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # false quando o site está numa hospedagem à parte (npm run release).
      SERVE_CLIENT: ${SERVE_CLIENT:-true}
      PORT: 4000
      DATABASE_URL: postgresql://biva:${POSTGRES_PASSWORD}@database:5432/biva
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_URL: ${PUBLIC_CLIENT_URL:-http://localhost:4003}
      APP_URL: ${PUBLIC_APP_URL:-http://localhost:4003}
      UPLOAD_DIR: /app/uploads
      SMS_CHANNELS: ${SMS_CHANNELS:-sms}
      SMS_DAILY_LIMIT: ${SMS_DAILY_LIMIT:-300}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_DAILY_LIMIT: ${EMAIL_DAILY_LIMIT:-0}
      EMAIL_HOURLY_LIMIT: ${EMAIL_HOURLY_LIMIT:-0}
      # Obrigatória em produção: cifra os IBAN dos criadores e os segredos da verificação em dois passos.
      PAYOUT_ENCRYPTION_KEY: ${PAYOUT_ENCRYPTION_KEY:?Set PAYOUT_ENCRYPTION_KEY in .env}
      # 1 = há um nginx à frente (o IP real de cada pessoa vem do nginx).
      TRUST_PROXY: ${TRUST_PROXY:-1}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SUBSCRIPTION_CURRENCY: ${SUBSCRIPTION_CURRENCY:-aoa}
      PROXYPAY_API_KEY: ${PROXYPAY_API_KEY:-}
      PROXYPAY_ENTITY_ID: ${PROXYPAY_ENTITY_ID:-}
      PROXYPAY_ENV: ${PROXYPAY_ENV:-production}
      PAYBYRD_API_KEY: ${PAYBYRD_API_KEY:-}
      LIVE_TURN_URL: ${LIVE_TURN_URL:-}
      LIVE_TURN_SECRET: ${LIVE_TURN_SECRET:-}
      LIVE_TURN_RELAY_ONLY: ${LIVE_TURN_RELAY_ONLY:-true}
      # Diretos em grande escala (MediaMTX + CDN). Vazios = modo direto até 8 pessoas.
      MEDIA_API_URL: ${MEDIA_API_URL:-}
      MEDIA_HLS_URL: ${MEDIA_HLS_URL:-}
      MEDIA_WHIP_URL: ${MEDIA_WHIP_URL:-}
      MEDIA_RTMP_URL: ${MEDIA_RTMP_URL:-}
      MEDIA_HOOK_SECRET: ${MEDIA_HOOK_SECRET:-}
      # Várias cópias da API (docker compose --profile scale up -d): limites partilhados no Redis.
      REDIS_URL: ${REDIS_URL:-}
      # Pagamentos internacionais (PayPal e RedotPay cobram em dólares).
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      PAYMENTS_KZ_PER_USD: ${PAYMENTS_KZ_PER_USD:-920}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-live}
      PAYPAL_CURRENCY: ${PAYPAL_CURRENCY:-USD}
      REDOTPAY_APP_KEY: ${REDOTPAY_APP_KEY:-}
      REDOTPAY_PRIVATE_KEY: ${REDOTPAY_PRIVATE_KEY:-}
      REDOTPAY_KEY_VERSION: ${REDOTPAY_KEY_VERSION:-1}
      REDOTPAY_PLATFORM_PUBLIC_KEY: ${REDOTPAY_PLATFORM_PUBLIC_KEY:-}
      # PayPay Africa (kwanzas, app PayPay).
      PAYPAY_PARTNER_ID: ${PAYPAY_PARTNER_ID:-}
      PAYPAY_PRIVATE_KEY: ${PAYPAY_PRIVATE_KEY:-}
      PAYPAY_PUBLIC_KEY: ${PAYPAY_PUBLIC_KEY:-}
      PAYPAY_SALE_PRODUCT_CODE: ${PAYPAY_SALE_PRODUCT_CODE:-}
      PAYPAY_API_URL: ${PAYPAY_API_URL:-}
      REDOTPAY_ENV: ${REDOTPAY_ENV:-production}
      REDOTPAY_CURRENCY: ${REDOTPAY_CURRENCY:-USD}
      # Notificações: app (Expo) e browser (web push, chaves VAPID).
      # SMS (Twilio Verify): confirmar o telemóvel e recuperar a conta.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      PUSH_NOTIFICATIONS: ${PUSH_NOTIFICATIONS:-true}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      CHALLENGES_AUTO: ${CHALLENGES_AUTO:-true}
      # Dados da empresa nos recibos.
      COMPANY_NAME: ${COMPANY_NAME:-}
      COMPANY_NIF: ${COMPANY_NIF:-}
      OFFICIAL_PAGE_EMAIL: ${OFFICIAL_PAGE_EMAIL:-}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-}
    ports:
      # Porta da primeira cópia; app2 e app3 usam 4004 e 4005 no perfil scale.
      - "127.0.0.1:4003:4000"
    volumes:
      - biva-uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app2:
    <<: *app
    profiles: ["scale"]
    ports:
      - "127.0.0.1:4004:4000"

  app3:
    <<: *app
    profiles: ["scale"]
    ports:
      - "127.0.0.1:4005:4000"

  # Servidor de vídeo dos diretos. Só arranca com: docker compose --profile live up -d
  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    profiles: ["live"]
    restart: unless-stopped
    environment:
      MTX_AUTHHTTPADDRESS: http://app:4000/api/media/auth?secret=${MEDIA_HOOK_SECRET:-}
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIA_PUBLIC_HOST:-}
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "1935:1935"            # RTMP (OBS, vMix, encoders)
      - "8189:8189/udp"        # WebRTC do WHIP
      - "8189:8189/tcp"
      - "127.0.0.1:8888:8888"  # HLS → nginx → CDN
      - "127.0.0.1:8889:8889"  # WHIP → nginx (HTTPS)
    depends_on:
      - app

  # Só para várias cópias da API: guarda os limites de pedidos partilhados (nada que precise de cópia de segurança).
  redis:
    image: redis:7-alpine
    profiles: ["scale"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

volumes:
  biva-postgres:
  biva-uploads:
