services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: biva
      POSTGRES_USER: biva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - biva-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biva -d biva"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVE_CLIENT: "true"
      PORT: 4000
      DATABASE_URL: postgresql://biva:${POSTGRES_PASSWORD}@database:5432/biva
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_URL: ${PUBLIC_CLIENT_URL:-http://localhost:4000}
      APP_URL: ${PUBLIC_APP_URL:-http://localhost:4000}
      UPLOAD_DIR: /app/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Obrigatória em produção: cifra os IBAN dos criadores e os segredos da verificação em dois passos.
      PAYOUT_ENCRYPTION_KEY: ${PAYOUT_ENCRYPTION_KEY:?Set PAYOUT_ENCRYPTION_KEY in .env}
      # 1 = há um nginx à frente (o IP real de cada pessoa vem do nginx).
      TRUST_PROXY: ${TRUST_PROXY:-1}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SUBSCRIPTION_CURRENCY: ${SUBSCRIPTION_CURRENCY:-aoa}
      PROXYPAY_API_KEY: ${PROXYPAY_API_KEY:-}
      PROXYPAY_ENTITY_ID: ${PROXYPAY_ENTITY_ID:-}
      PROXYPAY_ENV: ${PROXYPAY_ENV:-production}
      PAYBYRD_API_KEY: ${PAYBYRD_API_KEY:-}
      LIVE_TURN_URL: ${LIVE_TURN_URL:-}
      LIVE_TURN_SECRET: ${LIVE_TURN_SECRET:-}
      LIVE_TURN_RELAY_ONLY: ${LIVE_TURN_RELAY_ONLY:-true}
      # Diretos em grande escala (MediaMTX + CDN). Vazios = modo direto até 8 pessoas.
      MEDIA_API_URL: ${MEDIA_API_URL:-}
      MEDIA_HLS_URL: ${MEDIA_HLS_URL:-}
      MEDIA_WHIP_URL: ${MEDIA_WHIP_URL:-}
      MEDIA_RTMP_URL: ${MEDIA_RTMP_URL:-}
      MEDIA_HOOK_SECRET: ${MEDIA_HOOK_SECRET:-}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - biva-uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Servidor de vídeo dos diretos. Só arranca com: docker compose --profile live up -d
  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    profiles: ["live"]
    restart: unless-stopped
    environment:
      MTX_AUTHHTTPADDRESS: http://app:4000/api/media/auth?secret=${MEDIA_HOOK_SECRET:-}
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIA_PUBLIC_HOST:-}
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "1935:1935"            # RTMP (OBS, vMix, encoders)
      - "8189:8189/udp"        # WebRTC do WHIP
      - "8189:8189/tcp"
      - "127.0.0.1:8888:8888"  # HLS → nginx → CDN
      - "127.0.0.1:8889:8889"  # WHIP → nginx (HTTPS)
    depends_on:
      - app

volumes:
  biva-postgres:
  biva-uploads:
